<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Zumi — find homes to rent and buy in Zambia. Verified agents and owners.">
  <meta name="theme-color" content="#245045">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zumi">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Zumi — homes in Zambia</title>
  <!-- быстрее на медленном интернете: заранее открыть соединение с сервером Zumi (адрес вставляет сборка) -->
  <!--ZUMI_PRECONNECT-->
  <style>
    html, body { margin: 0; height: 100%; background: #245045; }
    /* заставка, пока загружается приложение (видна сразу, даже на 3G) */
    #zumi-loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; background: #245045; color: #FEF8EE; z-index: 10;
      font: 600 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; transition: opacity .3s; }
    #zumi-loading .logo { font-size: 30px; letter-spacing: 6px; font-weight: 700; }
    #zumi-loading .spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(254,248,238,.25);
      border-top-color: #FF7A59; animation: zs 0.9s linear infinite; }
    #zumi-loading .slow { opacity: 0; font-weight: 400; font-size: 13px; text-align: center; max-width: 260px;
      transition: opacity .4s; }
    #zumi-loading.is-slow .slow { opacity: .8; }
    @keyframes zs { to { transform: rotate(360deg); } }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="zumi-loading" role="status" aria-live="polite">
    <div class="logo">ZUMI</div>
    <div class="spin"></div>
    <div class="slow">Slow connection — Zumi is still loading. The next visit will be faster.</div>
  </div>
  <script>
    setTimeout(function () { var l = document.getElementById('zumi-loading'); if (l) l.className = 'is-slow'; }, 6000);
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('zumi-loading');
      if (!l) return;
      l.style.opacity = '0';
      setTimeout(function () { l.remove(); }, 350);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // старые версии сайта могли закэшироваться в service worker — убираем его,
    // чтобы после обновления сразу открывалась новая версия
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
      if (window.caches) {
        caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }).catch(function () {});
      }
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
