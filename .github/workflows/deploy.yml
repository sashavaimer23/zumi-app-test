# Тестовая версия Zumi: при каждом изменении кода GitHub сам собирает
# веб-приложение и выкладывает его на GitHub Pages (~5 минут).
name: Deploy test version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Show code errors (if any) as annotations
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | grep -E '^ *error' | head -40 | sed 's/^ */::error::/' || true
      - name: Build web
        env:
          # ключи хранятся в Settings → Secrets → Actions; пока их нет — демо-режим
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          flutter build web --release --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=MAPTILER_KEY="$MAPTILER_KEY"
      - name: Code check (report is published next to the app as analyze.txt)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings > build/web/analyze.txt 2>&1 || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
