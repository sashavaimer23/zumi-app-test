# Тестовая версия Zumi: при каждом изменении кода GitHub сам собирает
# веб-приложение и выкладывает его на GitHub Pages (~5 минут).
name: Deploy test version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Проверки базы на настоящем PostgreSQL + PostGIS: если что-то сломалось — сайт не обновляется
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: zumi
    steps:
      - uses: actions/checkout@v4
      - name: Build the database from all_in_one.sql and run the checks
        run: |
          set -o pipefail
          # чистая база, как новый проект Supabase (в готовом образе PostGIS уже стоит в public)
          createdb -T template0 zumi
          psql -q -v ON_ERROR_STOP=1 -f supabase/tests/00_supabase_stubs.sql
          psql -q -v ON_ERROR_STOP=1 -f supabase/all_in_one.sql > build.txt 2>&1 || {
            grep -B2 -A3 "ERROR" build.txt | sed 's/^/::error::/' ; exit 1; }
          psql -q -v ON_ERROR_STOP=1 -f supabase/tests/regression.sql 2> out.txt || {
            grep -E "FAILED|ERROR" out.txt | sed 's/^.*\(FAILED\|ERROR\)/::error::\1/' ; exit 1; }
          grep -c "ok  " out.txt | sed 's/^/Checks passed: /'

  build:
    needs: database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Show code errors (if any) as annotations
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | grep -E '^ *error' | head -40 | sed 's/^ */::error::/' || true
      - name: Tests (if a test fails, the site is not updated)
        run: flutter test -r github
      - name: Build web
        env:
          # ключи хранятся в Settings → Secrets → Actions; пока их нет — демо-режим
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          flutter build web --release --no-web-resources-cdn --pwa-strategy=none --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=MAPTILER_KEY="$MAPTILER_KEY"
          # заранее открыть соединение с сервером базы — на 3G экономит ~1 секунду
          if [ -n "$SUPABASE_URL" ]; then
            sed -i "s#<!--ZUMI_PRECONNECT-->#<link rel=\"preconnect\" href=\"$SUPABASE_URL\" crossorigin><link rel=\"dns-prefetch\" href=\"$SUPABASE_URL\">#" build/web/index.html
          fi
          # размер того, что скачивает человек при первом входе (в журнале сборки)
          du -k build/web/main.dart.js build/web/canvaskit/*.wasm build/web/canvaskit/chromium/*.wasm 2>/dev/null || true
      - name: Code check (report is published next to the app as analyze.txt)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings > build/web/analyze.txt 2>&1 || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
